# RH56H1 ROS2 控制器示例配置（与 ros2_controller_config.yaml 内容一致）
# 与 RH56F1 结构一致；唯一区别是触觉为 version2（压阻式），因此 touch_control 的 touch_version 设为 2。
# 使用方式：--controller-config 指向本文件，--device-config 指向 device_protocol_rh56h1_example.yaml

device_nodes:
  - device: hand_left
    update_rate: 50

    publish_header:
      frame_id: "hand_left"

    joint_names:
      - "hand_left/joint_0"
      - "hand_left/joint_1"
      - "hand_left/joint_2"
      - "hand_left/joint_3"
      - "hand_left/joint_4"
      - "hand_left/joint_5"

    topics:
      - name: angle_control
        registers:
          write: ["angleSet"]
          read: ["angleAct"]
        command_topic: "/hand_left/angle_set"
        state_topic: "/hand_left/angle_actual"

      - name: force_control
        registers:
          write: ["forceSet"]
          read: ["forceAct"]
        command_topic: "/hand_left/force_set"
        state_topic: "/hand_left/force_actual"

      # 速度控制话题
      - name: speed_control
        registers:
          write: ["speedSet"]
        command_topic: "/hand_left/speed_set"

      # 电流控制话题
      - name: current_control
        registers:
          write: ["currentSet"]
          read: ["currentAct"]
        command_topic: "/hand_left/current_set"
        state_topic: "/hand_left/current_actual"

      # 触觉数据话题（RH56H1 为 version2 压阻式）
      - name: touch_control
        registers:
          read: ["touchAct"]
        state_topic: "/hand_left/touch_data"
        touch_version: 2          # 触觉数据版本号（电容式：1，压阻式：2）；RH56H1 为 2

      # ===== 百分比接口（0.0~100.0，按手册量程自动换算，超范围自动裁剪）=====
      # 位置百分比：基于角度 angleSet/angleAct（手册 2.5.10 推荐；勿用电缸位置 posSet 0-2000）。
      # 逐关节换算，0%=握紧(最小角度)、100%=张开(最大角度)：
      #   四指(0-3): 0%->1690, 50%->1280, 100%->870
      #   拇指弯曲(4): 0%->1350, 50%->1150, 100%->950
      #   拇指旋转(5): 0%->1700, 50%->1200, 100%->700
      # 100% 等价于: angle_set [870,870,870,870,950,700]
      - name: pos_percent_control
        registers:
          write: ["angleSet"]
          read: ["angleAct"]
        command_topic: "/hand_left/pos_percent_set"      # rh56h1_interfaces/msg/SetPercent1
        state_topic: "/hand_left/pos_percent_actual"     # rh56h1_interfaces/msg/GetPercentAct1

      # 速度百分比：写 speedSet(0-3000)
      - name: speed_percent_control
        registers:
          write: ["speedSet"]
        command_topic: "/hand_left/speed_percent_set"    # rh56h1_interfaces/msg/SetPercent1

      # 力百分比：写 forceSet(0-900)
      - name: force_percent_control
        registers:
          write: ["forceSet"]
        command_topic: "/hand_left/force_percent_set"    # rh56h1_interfaces/msg/SetPercent1

      # 电流百分比：写 currentSet(0-1500)
      - name: current_percent_control
        registers:
          write: ["currentSet"]
        command_topic: "/hand_left/current_percent_set"  # rh56h1_interfaces/msg/SetPercent1

    services:
      - register_name: "angleSet"
        set_service_name: "/hand_left/set_angle"
        is_write_register: true

      - register_name: "forceSet"
        set_service_name: "/hand_left/set_force"
        is_write_register: true

      - register_name: "speedSet"
        set_service_name: "/hand_left/set_speed"
        is_write_register: true

      - register_name: "defaultSpeedSet"
        set_service_name: "/hand_left/set_defaultSpeed"
        is_write_register: true

      - register_name: "defaultForceSet"
        set_service_name: "/hand_left/set_defaultForceSet"
        is_write_register: true

      - register_name: "id"
        set_service_name: "/hand_left/set_id"
        is_write_register: true

      - register_name: "baudRate"
        set_service_name: "/hand_left/set_baudRate"
        is_write_register: true

      - register_name: "clearError"
        set_service_name: "/hand_left/set_clearError"
        is_write_register: true

      - register_name: "save"
        set_service_name: "/hand_left/set_save"
        is_write_register: true

      - register_name: "actionSeqIndex"
        set_service_name: "/hand_left/set_actionSeqIndex"
        is_write_register: true

      - register_name: "resetPara"
        set_service_name: "/hand_left/set_resetPara"
        is_write_register: true

      - register_name: "gestureForceClb"
        set_service_name: "/hand_left/set_gestureForceClb"
        is_write_register: true

      - register_name: "mode"
        set_service_name: "/hand_left/set_mode"
        is_write_register: true

      - register_name: "pause"
        set_service_name: "/hand_left/set_pause"
        is_write_register: true

      - register_name: "stop"
        set_service_name: "/hand_left/set_stop"
        is_write_register: true

      # ===== 百分比接口服务（0.0~100.0，按手册量程自动换算，超范围自动裁剪）=====
      # register_name 使用 xxxPercent 约定键，适配器内部换算后写入/读取对应原寄存器
      - register_name: "posSetPercent"        # -> 写 angleSet（各指角度范围，0%=握紧/100%=张开）
        set_service_name: "/hand_left/set_pos_percent"       # rh56h1_interfaces/srv/Setpercent
        is_write_register: true

      - register_name: "speedSetPercent"      # -> 写 speedSet(0-3000)
        set_service_name: "/hand_left/set_speed_percent"     # rh56h1_interfaces/srv/Setpercent
        is_write_register: true

      - register_name: "forceSetPercent"      # -> 写 forceSet(0-900)
        set_service_name: "/hand_left/set_force_percent"     # rh56h1_interfaces/srv/Setpercent
        is_write_register: true

      - register_name: "currentSetPercent"    # -> 写 currentSet(0-1500)
        set_service_name: "/hand_left/set_current_percent"   # rh56h1_interfaces/srv/Setpercent
        is_write_register: true

      - register_name: "posActPercent"        # -> 读 angleAct（各指角度范围，0%=握紧/100%=张开）
        get_service_name: "/hand_left/get_pos_percent"       # rh56h1_interfaces/srv/Getpercent
        is_write_register: false

      - register_name: "errorCode"
        get_service_name: "/hand_left/get_errorCode"
        is_write_register: false

      - register_name: "status"
        get_service_name: "/hand_left/get_status"
        is_write_register: false

      - register_name: "temp"
        get_service_name: "/hand_left/get_temp"
        is_write_register: false
